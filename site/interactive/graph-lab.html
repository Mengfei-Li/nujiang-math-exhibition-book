<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>九点加边与三角形计数器</title>
<style>
:root{--navy:#0b3c5d;--blue:#145da0;--gold:#f4b942;--orange:#e4572e;--green:#2a9d8f}
*{box-sizing:border-box}body{margin:0;padding:18px;background:#f7fafc;color:var(--navy);font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.app{max-width:940px;margin:auto;background:white;border:1px solid #d9e3ea;border-radius:18px;padding:20px;box-shadow:0 8px 25px #0b3c5d16}
h1{font-size:1.35rem;margin:.2rem 0}.layout{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:15px}
svg{width:100%;height:auto;background:#fffdf8;border:1px solid #e4eaee;border-radius:14px}
.panel{background:#eef6ff;border-radius:14px;padding:14px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}select,button{font:inherit;padding:8px;border-radius:8px;border:1px solid #a9bdc9}
button{grid-column:span 2;background:var(--blue);color:white;font-weight:700;cursor:pointer}.reset{background:white;color:var(--navy);border:2px solid var(--blue)}
.meter{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.meter div{background:white;border-radius:10px;text-align:center;padding:9px}.meter b{display:block;font-size:1.5rem}
.triangles{max-height:180px;overflow:auto;background:white;border-radius:10px;padding:10px;line-height:1.6}.note{font-size:.92rem;line-height:1.55;color:#4e626f}
@media(max-width:720px){.layout{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
  <h1>互动实验：在固定六边上继续加边</h1>
  <p class="note">蓝色粗线是题面固定边，不能删除；橙色线是你加的边。任选两个顶点切换一条边，程序会实时列出所有三角形。线段交叉处不会自动变成顶点。</p>
  <div class="layout">
    <svg id="board" viewBox="0 0 650 550" role="img" aria-label="九点图加边实验"></svg>
    <aside class="panel">
      <div class="controls">
        <select id="u" aria-label="第一个顶点"></select><select id="v" aria-label="第二个顶点"></select>
        <button id="toggle">增加这条边</button><button id="reset" class="reset">恢复固定六边</button>
      </div>
      <div class="meter"><div>总边数<b id="edgeCount">6</b></div><div>三角形数<b id="triCount">0</b></div></div>
      <div class="triangles" id="triList">暂时没有三角形。</div>
      <p class="note"><b>试一试：</b>先加 23，会立刻出现三角形 123，总边数为 7。这证明 E(n,1) ≤ 7；再结合固定六边本身没有三角形，得到精确值 7。</p>
    </aside>
  </div>
</main>
<script>
const fixed=['1-2','1-3','1-4','1-5','6-7','8-9'],edges=new Set(fixed);
const pos={1:[325,92],2:[120,205],3:[225,265],4:[425,265],5:[535,190],6:[95,430],7:[235,430],8:[420,430],9:[560,430]};
const svg=document.getElementById('board'),NS='http://www.w3.org/2000/svg';
function key(a,b){return Math.min(a,b)+'-'+Math.max(a,b)}
function tri(){
 const out=[];for(let a=1;a<=9;a++)for(let b=a+1;b<=9;b++)for(let c=b+1;c<=9;c++)if(edges.has(key(a,b))&&edges.has(key(a,c))&&edges.has(key(b,c)))out.push([a,b,c]);return out
}
function el(tag,attrs){const x=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))x.setAttribute(k,v);return x}
function draw(){
 svg.replaceChildren();const ts=tri();
 for(const t of ts){const points=t.map(v=>pos[v].join(',')).join(' ');svg.appendChild(el('polygon',{points,fill:'#2a9d8f',opacity:.18,stroke:'#2a9d8f','stroke-width':3}))}
 for(const e of edges){const [a,b]=e.split('-').map(Number),p=pos[a],q=pos[b],isFixed=fixed.includes(e);svg.appendChild(el('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:isFixed?'#145da0':'#e4572e','stroke-width':isFixed?7:4,'stroke-linecap':'round'}))}
 for(let v=1;v<=9;v++){const [x,y]=pos[v];svg.appendChild(el('circle',{cx:x,cy:y,r:24,fill:'#f4b942',stroke:'#0b3c5d','stroke-width':3}));const t=el('text',{x:x,y:y+7,'text-anchor':'middle','font-size':21,'font-weight':700,fill:'#0b3c5d'});t.textContent=v;svg.appendChild(t)}
 document.getElementById('edgeCount').textContent=edges.size;document.getElementById('triCount').textContent=ts.length;
 document.getElementById('triList').textContent=ts.length?'三角形：'+ts.map(x=>x.join('')).join('、'):'暂时没有三角形。';
 updateButton();
}
const u=document.getElementById('u'),v=document.getElementById('v');for(let i=1;i<=9;i++){u.add(new Option('顶点 '+i,i));v.add(new Option('顶点 '+i,i))}u.value=2;v.value=3;
function updateButton(){const e=key(Number(u.value),Number(v.value));document.getElementById('toggle').textContent=fixed.includes(e)?'这是固定边，不能删除':edges.has(e)?'删除这条新增边':'增加这条边'}
document.getElementById('toggle').onclick=()=>{const a=Number(u.value),b=Number(v.value);if(a===b)return;const e=key(a,b);if(fixed.includes(e))return;if(edges.has(e))edges.delete(e);else edges.add(e);draw()};
document.getElementById('reset').onclick=()=>{edges.clear();fixed.forEach(e=>edges.add(e));draw()};u.onchange=updateButton;v.onchange=updateButton;draw();
</script>
</body>
</html>
